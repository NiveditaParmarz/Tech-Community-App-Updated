<div class="search-container">
  <app-header></app-header>
  
  <main class="search-main">
    <div class="search-card">
      <h2>Advanced Search</h2>
      <p>Search questions using multiple filters</p>
      
      <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-form">
        <div class="form-row">
          <div class="form-group">
            <label for="text">Search Text</label>
            <input 
              type="text" 
              id="text" 
              formControlName="text" 
              placeholder="Enter keywords..."
            >
          </div>
          
          <div class="form-group">
            <label for="email">Author Email</label>
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="author@example.com"
            >
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="tag">Tag</label>
            <input 
              type="text" 
              id="tag" 
              formControlName="tag" 
              placeholder="e.g., bug, feature"
            >
          </div>
          
          <div class="form-group">
            <label for="date">Date</label>
            <input 
              type="date" 
              id="date" 
              formControlName="date"
            >
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="size">Results per page</label>
            <select id="size" formControlName="size">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="!isLoading">Search</span>
            <span *ngIf="isLoading">Searching...</span>
          </button>
          <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
        </div>
      </form>
    </div>
    
    <div class="error-alert" *ngIf="errorMessage">
      <p>{{ errorMessage }}</p>
    </div>
  </main>
  
  <app-footer></app-footer>
</div>
